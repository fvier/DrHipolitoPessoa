services:
  app:
    container_name: drhipolito-app
    build:
      context: .
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.drhipolito-http.rule=Host(`drhipolitopessoa.com.br`) || Host(`www.drhipolitopessoa.com.br`)"
      - "traefik.http.routers.drhipolito-http.entrypoints=http"
      - "traefik.http.routers.drhipolito-http.middlewares=drhipolito-https"
      - "traefik.http.middlewares.drhipolito-https.redirectscheme.scheme=https"
      - "traefik.http.routers.drhipolito.rule=Host(`drhipolitopessoa.com.br`)"
      - "traefik.http.routers.drhipolito.entrypoints=https"
      - "traefik.http.routers.drhipolito.tls=true"
      - "traefik.http.routers.drhipolito.tls.certresolver=letsencrypt"
      - "traefik.http.routers.drhipolito-www.rule=Host(`www.drhipolitopessoa.com.br`)"
      - "traefik.http.routers.drhipolito-www.entrypoints=https"
      - "traefik.http.routers.drhipolito-www.tls=true"
      - "traefik.http.routers.drhipolito-www.tls.certresolver=letsencrypt"
      - "traefik.http.services.drhipolito.loadbalancer.server.port=8000"
      - "traefik.docker.network=coolify"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Configure DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-drhipolitopessoa.com.br,www.drhipolitopessoa.com.br,147.79.110.132,localhost,127.0.0.1}
      DATABASE_URL: postgres://${POSTGRES_USER:-drhipolito}:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-drhipolito}
    command:
      - /bin/sh
      - -c
      - python manage.py migrate --noinput && python manage.py collectstatic --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2 --access-logfile - --error-logfile - --timeout 60
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - drhipolito_media:/app/larkon/media
      - drhipolito_static:/app/staticfiles
    networks:
      - coolify
      - default

  postgres:
    container_name: drhipolito-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drhipolito}
      POSTGRES_USER: ${POSTGRES_USER:-drhipolito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: drhipolito_postgres_data
  drhipolito_media:
    name: drhipolito_media
  drhipolito_static:
    name: drhipolito_static

networks:
  coolify:
    external: true
  default:
