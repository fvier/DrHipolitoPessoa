<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="100%" height="100%">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&amp;family=Montserrat:wght@400;500;600;700&amp;display=swap");
      .brand-title {
        font-family: "Montserrat", "Segoe UI", sans-serif;
        font-size: 32px;
        font-weight: 600;
        letter-spacing: 2.5px;
        fill: #0d7490;
      }
      .brand-sub {
        font-family: "Montserrat", sans-serif;
        font-size: 11px;
        font-weight: 500;
