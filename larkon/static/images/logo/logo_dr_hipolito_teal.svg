    <line x1="0" y1="12" x2="315" y2="12" class="divider" />
    <text x="2" y="29" class="brand-sub">GERIATRIA &amp; PSIQUIATRIA</text>
    <text x="2" y="44" style="font-family: Montserrat, sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 3px; fill: #64748b;">CRM RN 7742</text>
  </g>
</svg>