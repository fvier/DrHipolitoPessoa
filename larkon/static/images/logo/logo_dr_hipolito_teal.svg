        stroke-opacity: 0.65;
      }
    </style>
  </defs>
  <!-- Tree Symbol -->
  <g transform="translate(5, 5)">
    <image href="data:image/png;base64," x="0" y="0" width="100" height="100" />
  </g>
  <!-- Typography -->
  <g transform="translate(125, 50)">
